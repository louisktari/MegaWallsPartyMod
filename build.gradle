buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.minecraftforge.net/" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

repositories {
    maven { url = "https://libraries.minecraft.net/" }
    maven { url = "https://maven.minecraftforge.net/" }
    mavenCentral()
}

version = project.findProperty("modVersion") ?: "0.0.0"
group = "fr.alexdoru.partymod"
archivesBaseName = "MegaWallsPartyMod"

sourceCompatibility = targetCompatibility = 1.8
tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"
    makeObfSourceJar = false
}

dependencies {
    // OneConfig API is provided at runtime by the embedded stage-0 loader.
    compile files('libs/oneconfig.jar')
    testCompile 'junit:junit:4.12'
}

processResources {
    inputs.property "version", project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    // Embed only the OneConfig stage-0 loader; it downloads/loads OneConfig at launch.
    from(zipTree('libs/oneconfig-loader.jar')) { include 'cc/polyfrost/oneconfig/loader/stage0/**' }
    from('licenses') { into 'META-INF/licenses' }
    from('THIRD-PARTY.md') { into 'META-INF' }
    manifest {
        attributes(
            'TweakClass': 'cc.polyfrost.oneconfig.loader.stage0.LaunchWrapperTweaker',
            'TweakOrder': '0',
            'FMLCorePluginContainsFMLMod': 'true',
            'Implementation-Version': project.version
        )
    }
}

test {
    testLogging { events 'failed'; exceptionFormat 'full' }
}
